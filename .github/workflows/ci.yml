name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claw-and-order
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: claw-and-order/requirements*.txt
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest tests -q
